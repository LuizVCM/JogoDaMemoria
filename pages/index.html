<body>
    <div class="todo google-font " id="todo">
    <h1> JOGO DA MEMORIA DO TDS</h1>
    <h3> Aqui você tem 3 dificuldades para selecionar. Escolha uma delas</h3>
    
    <!-- Parte inicial-->

<div class="inicial" id="inicial">

 <div class="back"></div>    

<button class="escolha" id="escolha1">Fácil

    <p> Nível mais fácil do jogo. Nele serão 12 cartas espalhadas para encontrar dentro de 6 minutos. 
    
        Detalhes da dificuldade:

        <span> Tempo limite: 6 minutos </span>
        <span> Número de cartas: 12 </span>
        <span> Pontuação máxima: 60 pontos </span>
        <span> Pontos por par encontrado: 10 pontos </span>
        <span> Pontos perdidos por par falho: 1 ponto </span>
    </p>

</button>

<button class="escolha" id="escolha2">Médio

    <p> Nível médio do jogo. Nele serão 20 cartas espalhadas para encontrar dentro de 8 minutos. 
    
        Detalhes da dificuldade:

        <span> Tempo limite: 8 minutos </span>
        <span> Número de cartas: 20 </span>
        <span> Pontuação máxima: 100 pontos </span>
        <span> Pontos por par encontrado: 10 pontos </span>
        <span> Pontos perdidos por par falho: 5 ponto </span>
    </p>

</button>
<button class="escolha" id="escolha3">Difícil

    <p> Nível difícil do jogo. Nele serão 30 cartas espalhadas para encontrar dentro de 8 minutos. 
    
        Detalhes da dificuldade:

        <span> Tempo limite: 8 minutos </span>
        <span> Número de cartas: 30 </span>
        <span> Pontuação máxima: 120 pontos </span>
        <span> Pontos por par encontrado: 8 pontos </span>
        <span> Pontos perdidos por par falho: 3 ponto </span>
    </p>
</button>
</div>
</div>
